server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${USER_DB_USERNAME:sa}
    password: ${USER_DB_PASSWORD:}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  seed-data:
    enabled: ${APP_SEED_DATA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    root: INFO
    com.platform.userservice: DEBUG
