server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      routes:
        - id: user-service-route
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**

        - id: product-service-route
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**

        - id: order-service-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**

        - id: user-service-health-route
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/health/users
          filters:
            - SetPath=/actuator/health

        - id: product-service-health-route
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/health/products
          filters:
            - SetPath=/actuator/health

        - id: order-service-health-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/health/orders
          filters:
            - SetPath=/actuator/health

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:${GATEWAY_SECURITY_ENABLED:true}}
    secret: ${JWT_SECRET:cloud_platform_api_gateway_super_secure_jwt_signing_key_2026_min_256_bits!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

gateway:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:100}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  cache:
    enabled: ${CACHE_ENABLED:false}
    expiration-seconds: ${CACHE_EXPIRATION_SECONDS:60}
    max-size: ${CACHE_MAX_SIZE:100}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.platform.gateway: DEBUG
