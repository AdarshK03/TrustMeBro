server:
  port: ${ORDER_SERVICE_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${ORDER_DB_USERNAME:sa}
    password: ${ORDER_DB_PASSWORD:}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    root: INFO
    com.platform.orderservice: DEBUG
