server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:h2:mem:productsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${PRODUCT_DB_USERNAME:sa}
    password: ${PRODUCT_DB_PASSWORD:}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  seed-data:
    enabled: ${APP_SEED_DATA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    root: INFO
    com.platform.productservice: DEBUG
